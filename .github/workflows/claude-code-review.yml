name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- \
            '*.py' '*.vue' '*.js' '*.ts' '*.json' \
            > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: Claude code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pip install -q anthropic

          python3 - <<'PYEOF'
          import anthropic, os, subprocess, json

          diff = open("pr_diff.txt").read()
          if not diff.strip():
              print("No code changes to review.")
              exit(0)

          # Truncate if very large
          if len(diff) > 30000:
              diff = diff[:30000] + "\n\n[diff truncated for length]"

          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])

          response = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=1024,
              system="""You are an expert code reviewer. Review the PR diff and provide concise, actionable feedback.
          Structure your response with these sections (only include sections with findings):
          - **Summary**: 1-2 sentences on what the PR does
          - **Issues**: Bugs, security concerns, or breaking changes (if any)
          - **Suggestions**: Non-blocking improvements worth considering (if any)
          - **Looks good**: Things done well

          Be specific — reference file names and line context. Keep the total response under 400 words.""",
              messages=[{
                  "role": "user",
                  "content": f"PR: {os.environ['PR_TITLE']}\n\n```diff\n{diff}\n```"
              }]
          )

          review = response.content[0].text

          comment = f"## Claude Code Review\n\n{review}\n\n---\n*Automated review by Claude claude-sonnet-4-6*"

          # Post comment via GitHub API
          import urllib.request
          data = json.dumps({"body": comment}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=data,
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github.v3+json"
              }
          )
          urllib.request.urlopen(req)
          print("Review posted successfully.")
          PYEOF
